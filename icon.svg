<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2b38"/>
      <stop offset="1" stop-color="#0c1620"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6c93f"/>
      <stop offset="1" stop-color="#589632"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- Q ring -->
  <circle cx="116" cy="124" r="58" fill="none" stroke="url(#ring)" stroke-width="22"/>
  <!-- Tail, separated from the ring by a knockout in the tile colour -->
  <path d="M128 136 L184 192" stroke="#0f1b25" stroke-width="40" stroke-linecap="round"/>
  <path d="M128 136 L184 192" stroke="#ee7913" stroke-width="22" stroke-linecap="round"/>
