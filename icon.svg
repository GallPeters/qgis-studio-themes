<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#14232f"/>
  <!-- Q ring -->
  <circle cx="110" cy="110" r="60" fill="none" stroke="#93b023" stroke-width="20"/>
  <!-- Brush, drawn along the x axis from the ring centre, rotated 45 degrees -->
  <g transform="translate(110 110) rotate(45) scale(1.15)">
    <!-- Knockout separating the brush from the ring -->
    <g fill="#14232f" stroke="#14232f" stroke-width="10" stroke-linejoin="round">
      <path d="M10 0 C22 -7 34 -14 48 -14 L48 14 C34 14 22 7 10 0 Z"/>
      <rect x="48" y="-15" width="22" height="30" rx="4"/>
      <path d="M70 -11 L132 -6.5 A6.5 6.5 0 0 1 132 6.5 L70 11 Z"/>
    </g>
    <!-- Bristles -->
    <path d="M10 0 C22 -7 34 -14 48 -14 L48 14 C34 14 22 7 10 0 Z" fill="#ee7913"/>
    <!-- Ferrule -->
    <rect x="48" y="-15" width="22" height="30" rx="4" fill="#f0e64a"/>
    <!-- Handle -->
    <path d="M70 -11 L132 -6.5 A6.5 6.5 0 0 1 132 6.5 L70 11 Z" fill="#589632"/>
  </g>
</svg>
